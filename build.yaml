# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
# NOTE: the key is `cmake-args` — lowercase and hyphenated. `CMAKE_ARGS:` is
# silently ignored by the ZMK workflow: the build goes green and the flag never
# applies.
---
include:
  # ---------------------------------------------------------------------
  # Dongled keyboard — the MacroKnob is the central.
  # Flash as a pair: left_dongled + right
  # Dongle firmware: theepicflyer/macroknob-shield@splitkb_aurora_lily58
  # ---------------------------------------------------------------------
  - board: nice_nano_v2
    shield: splitkb_aurora_lily58_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: splitkb_aurora_lily58_left_dongled

  # ---------------------------------------------------------------------
  # Standalone keyboard, LEFT as central (the ZMK default).
  # Flash as a pair: left + right
  # ---------------------------------------------------------------------
  - board: nice_nano_v2
    shield: splitkb_aurora_lily58_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: splitkb_aurora_lily58_left_central
  - board: nice_nano_v2
    shield: splitkb_aurora_lily58_right
    artifact-name: splitkb_aurora_lily58_right_peripheral

  # ---------------------------------------------------------------------
  # Standalone keyboard, RIGHT as central.
  # Flash as a pair: left_peripheral + right_central
  # Upstream sets ZMK_KEYBOARD_NAME only under the _left shield. Without a name
  # a right-central build advertises as "", so it is set in
  # config/splitkb_aurora_lily58_right.conf (a .conf file avoids the Kconfig
  # string-quoting mess that -DCONFIG_...="..." runs into here).
  # ---------------------------------------------------------------------
  - board: nice_nano_v2
    shield: splitkb_aurora_lily58_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: splitkb_aurora_lily58_left_peripheral
  - board: nice_nano_v2
    shield: splitkb_aurora_lily58_right
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y -DCONFIG_ZMK_STUDIO=y
    artifact-name: splitkb_aurora_lily58_right_central

  # ---------------------------------------------------------------------
  # Standalone keyboard, RIGHT as central, with the nice!oled custom status
  # screen (mctechnology17/zmk-nice-oled) on the 128x32 SSD1306 displays.
  #
  # The module keys off ZMK's own role config, so the central half gets the
  # status widgets and the peripheral half gets the animation/battery screen.
  #
  # Display settings live in config/nice_oled.conf, which ZMK applies only to
  # builds whose shield list includes `nice_oled` — so the plain builds stay
  # untouched and remain a working rollback.
  # ---------------------------------------------------------------------
  - board: nice_nano_v2
    shield: splitkb_aurora_lily58_left nice_oled
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: splitkb_aurora_lily58_left_peripheral_oled
  - board: nice_nano_v2
    shield: splitkb_aurora_lily58_right nice_oled
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y -DCONFIG_ZMK_STUDIO=y
    artifact-name: splitkb_aurora_lily58_right_central_oled

  # Universal — flash to any half to clear stored settings and BT pairings.
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: settings_reset
