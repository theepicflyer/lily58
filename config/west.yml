manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: mctechnology17
      url-base: https://github.com/mctechnology17
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3.0
      import: app/west.yml
    # Custom status screen for the 128x32 OLEDs. Only takes effect on builds
    # that include the `nice_oled` shield, so the plain builds are unaffected.
    - name: zmk-nice-oled
      remote: mctechnology17
      revision: main
  self:
    path: config
