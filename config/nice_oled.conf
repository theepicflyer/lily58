# Config for builds that include the `nice_oled` shield.
#
# ZMK applies <ZMK_CONFIG>/<shield>.conf for every shield in the SHIELD list,
# so this file affects only the nice!oled builds — the plain builds are
# untouched and remain a working rollback.

# Required by zmk-nice-oled: it replaces ZMK's built-in status screen.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# ---------------------------------------------------------------------------
# Canvas geometry — THE setting that makes this module work on a 128x32 panel.
#
# zmk-nice-oled draws every widget into one portrait canvas and then rotates it
# 90 degrees for the physical display. The canvas dimensions are Kconfig ints,
# and the module's README documents these defaults:
#
#     CONFIG_NICE_OLED_CUSTOM_CANVAS_WIDTH    68 (ePaper), 32 (OLED)
#     CONFIG_NICE_OLED_CUSTOM_CANVAS_HEIGHT  160 (ePaper), 128 (OLED)
#
# But its Kconfig.defconfig ships them WITHOUT the per-shield branch that every
# neighbouring symbol has — a plain `default 68` / `default 160`. So a 128x32
# build silently inherits nice!view geometry: a 68x160 design rotated to 160x68,
# of which a 128x32 panel shows a fraction, and no amount of per-widget
# repositioning can fix it. That is what sank the first attempt at this.
#
# Setting them explicitly makes the geometry exact rather than approximate:
#
#   canvas 32 wide x 128 tall
#     -> widgets/screen.c sizes the object CANVAS_HEIGHT x CANVAS_WIDTH = 128x32
#     -> rotate_canvas() spins a 128x128 square buffer about (64,64)
#     -> a 32x128 portrait design becomes a 128x32 landscape image. Exact fit.
#
# The coordinate model that follows from this:
#
#   design X (0..32)   -> physical VERTICAL position   (the 32px short axis)
#   design Y (0..128)  -> physical HORIZONTAL position (the 128px long axis)
#
# Corroboration that 32x128 is what the OLED defaults were authored for: every
# information widget has an OLED default X <= 32 (layer, battery, profile,
# output, wpm, modifiers, raw-hid all fit a 32-wide canvas), and only the large
# animations use X = 64/65 — those are the ones written for the 68-wide ePaper
# canvas.
# ---------------------------------------------------------------------------
CONFIG_NICE_OLED_CUSTOM_CANVAS_WIDTH=32
CONFIG_NICE_OLED_CUSTOM_CANVAS_HEIGHT=128

# ---------------------------------------------------------------------------
# Two coordinate defaults still assume the 160-tall ePaper canvas and land
# past the end of a 128-tall one, so they need overriding even with the canvas
# set correctly:
#
#     LAYER    default Y = 146   -> off the long axis
#     PROFILE  default Y = 137   -> off the long axis
#
# They move into the slots freed by disabling the WPM gauge (Y=70) and the
# modifier box (Y=100) below. Every other widget's default is already in
# bounds and is deliberately left alone — this file overrides what is broken,
# not what merely could be moved.
#
# These two values are a starting point, not a measured layout: they are the
# first thing to nudge when looking at the actual screen.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# The coordinate model, read off a photo of the running screen (2026-09-20).
#
# The panel is mounted PORTRAIT: looking at the keyboard, the 32px axis runs
# left-to-right and the 128px axis runs top-to-bottom. Widgets stack down the
# strip in ascending Y and text reads normally across the width.
#
# The two config coordinates are the two arguments of the LVGL canvas draw
# calls and behave exactly as LVGL documents them - no inversion, no mirroring:
#
#   CUSTOM_X  the 32px axis, 0 = left.  Extent here is an image's WIDTH, or for
#             text the glyph advance times the character count.
#   CUSTOM_Y  the 128px axis, 0 = top.  Extent here is an image's HEIGHT, or for
#             text the font's line_height.
#
# An earlier version of this comment had the extents swapped (height on X,
# width on Y) and claimed X was inverted. Both were wrong, and together they
# made the free space along the strip look about half its real size. The photo
# disproves the inversion directly: 24px-wide "51%" at X=9 sits right of centre
# and clips at the right edge - that is 9..33, not 32-9-24.
#
# Font metrics, from the module's src/fonts/:
#
#   pixel_operator_mono_16   advance 8px, line_height 13   layer, battery
#   pixel_operator_mono_8    advance 4px, line_height  7   profile number
#
# Centring on the 32px axis is X = (32 - width) / 2, and every widget is now on
# centre 16. They were not before: the battery sat at X=9, so "51%" spanned
# 9..33 with its centre at 21 and the last pixel off the panel. Against that the
# modifier block, which is genuinely centred at 1..31, read as left-shifted.
#
#   X  8   layer label      16px for 2 chars (mono_16 advances 8px)
#   X 10   BT icon          w=12
#   X  5   BT unbonded      w=22
#   X  6   USB icon         w=20
#   X  4   battery text     24px for "51%"
#   X  0   profile dots     w=31
#   X  1   modifier block   30x30
#
# Battery is the one that cannot be centred for every value, because the text is
# left-aligned at a fixed X and its width changes: "9%" is 16px, "51%" 24px,
# "100%" 32px. X=4 centres the common 3-character case and still clips less at
# 100% than X=9 did.
#
# The runs along the 128px axis, with each element's real extent:
#
#   Y   4..17    layer label     (mono_16, line_height 13)
#   Y  31..46    BT icon         (h=15; USB is h=11, so 31..42)
#   Y  49..52    profile dots    (h=3)
#   Y  66..79    battery text    (mono_16, line_height 13)
#   Y  96..126   modifier icons  (2x2 block of 14x14, spacing 2)
#   Y 104..128   caps-lock Luna  (physical-space object)
#
# Gaps: 4 at the top, 14 between the readouts, 3 between the BT icon and the
# profile dots so the two read as one unit, 17 before the modifier block since
# it is a separate group, 2 at the bottom.
#
# Luna sits on top of the modifier block while caps lock is on. There is no
# 24px run left for it anywhere else on a full strip, so it stays; drop the four
# HID_INDICATORS lines below to remove caps-lock display instead.
# ---------------------------------------------------------------------------
CONFIG_NICE_OLED_WIDGET_LAYER_CUSTOM_X=8
CONFIG_NICE_OLED_WIDGET_LAYER_CUSTOM_Y=4
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_CUSTOM_X=10
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_CUSTOM_Y=31
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_UNBONDED_CUSTOM_X=5
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_UNBONDED_CUSTOM_Y=31
CONFIG_NICE_OLED_WIDGET_OUTPUT_USB_CUSTOM_X=6
CONFIG_NICE_OLED_WIDGET_OUTPUT_USB_CUSTOM_Y=31
CONFIG_NICE_OLED_WIDGET_BATTERY_CUSTOM_X=4
CONFIG_NICE_OLED_WIDGET_BATTERY_CUSTOM_Y=66

# ---------------------------------------------------------------------------
# Modifier icons — Ctrl / Shift / Alt / Gui, 14x14, filled while held, in a
# 2x2 block.
#
# Layout choice, since the branches differ in what they let you position
# (screen.c draw_mods_status):
#
#   BOX  base_x and base_y both from MODIFIERS_CUSTOM_*, 2x2 offsets of
#        img_size+spacing = 16. Block is 30x30, which fits the 32px short
#        axis with 2px to spare. This is the one in use.
#   HOR  also fully configurable, but lays four icons along the short axis:
#        needs 62px where there are 32.
#   VER  stacks along the long axis (62px of the 128), but base_y is hardcoded
#        to 62 and only the ALIGN_LEFT variant takes a configurable base_x —
#        align-center/right hardcode `68 - img_size` / `128 - img_size`, which
#        fall outside a 32-wide canvas.
#
# BOX is both the tidier shape and the one with two free coordinates, so it
# also leaves room for the caps-lock art at the tail instead of colliding
# with it, which the 62px VER row did.
#
# Symbol style is Windows (Win/Alt), not the default macOS (Cmd/Opt), to match
# the host this keyboard is used with.
# ---------------------------------------------------------------------------
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_BOX=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL_WINDOWS=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_CUSTOM_X=1
CONFIG_NICE_OLED_WIDGET_MODIFIERS_CUSTOM_Y=96

# ---------------------------------------------------------------------------
# Caps lock — shown as Luna the barking dog, because that is the only rendering
# this module offers.
#
# The HID indicator widget has no text or lock-icon mode: with neither LUNA nor
# BONGO_CAT enabled, hid_indicators.c takes the HID_HAS_ANIMATION=0 branch and
# sets the label to "" — "Widget remains functional but displays nothing
# visually". So an animation is the only way to see caps lock at all.
#
# Of the two, only Luna fits: dog_bark1_90 is 24x32 (pre-rotated, exactly the
# panel height) while bongo_cat_double_tap2_03 is 26x50 on a 32px panel.
#
# ONLY_CAPSLOCK defaults to y, so num/scroll lock will not trigger it.
#
# Placement is in PHYSICAL space (it is an LVGL object, not a canvas draw).
# X=104 puts it in the 24px of tail left free by the 2x2 modifier block, so
# nothing is covered. Delete these four lines to drop caps-lock entirely.
# ---------------------------------------------------------------------------
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=y
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_LUNA=y
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_CUSTOM_X=104
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_CUSTOM_Y=0

# ---------------------------------------------------------------------------
# Bluetooth profile — the row of five dots, directly under the BT icon.
#
# draw_profile_status() (widgets/profile.c) draws two independent things and
# guards neither, but they have separate coordinates, so either can be parked
# past the 128px axis on its own — LVGL clips the draw and nothing renders.
#
#   the dot row   a 31x3 image of five 3x3 outline marks spaced 7 apart, plus
#                 a solid 3x3 block over the active one. At PROFILE_*.
#   the number    one digit in mono_8, 4x7. At PROFILE_TEXT_*.
#
# The dots win on this panel: 31x3 spans the full width for 3px of the strip,
# and the filled mark's position reads at a glance, where the number would be a
# 4px glyph beside 8px readouts — half the size of everything else on screen.
#
# X=0 centres the 31px row in 32. Y=49 puts it 3px below the BT icon so the two
# read as one unit.
#
# To swap the number back in: park PROFILE_CUSTOM_Y at 200 and set
# PROFILE_TEXT_CUSTOM_X=14 (centres 4px) with a Y that has 7px free.
# ---------------------------------------------------------------------------
CONFIG_NICE_OLED_WIDGET_PROFILE_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_PROFILE_CUSTOM_Y=49
CONFIG_NICE_OLED_WIDGET_PROFILE_TEXT_CUSTOM_Y=200

# ---------------------------------------------------------------------------
# WPM off. Its default X of 64/65 is authored for the 68-wide ePaper canvas, and
# the setting also gates the bongo cat and Luna animations (widgets/wpm.c), both
# sized for that canvas. There is a text-only CONFIG_NICE_OLED_WIDGET_WPM_NUMBER
# variant that would fit if the strip ever has room, but the modifier row now
# occupies the space it would use.
# ---------------------------------------------------------------------------
CONFIG_NICE_OLED_WIDGET_WPM=n

# ---------------------------------------------------------------------------
# Peripheral (left) half: BT status and battery only, no crystal art.
#
# SMART_BATTERY does NOT replace the art with a battery figure, contrary to
# what an earlier version of this file claimed: battery.c defines
# SET_ANIMATION_SMART_BATTERY_OFF as &crystal_01, so discharging shows a static
# crystal and charging shows the 16-frame animated one. Either way it is art.
#
# And the art cannot fit this panel. crystal_01 is 69x68 — nice!view sized —
# while the peripheral container is 128x32. Worse, the art is a separate LVGL
# object aligned in PHYSICAL space over the rotated canvas, not drawn into it,
# so at its default (18, -18) it spans x 18..87 across the full 32px height:
# two thirds of the screen, on top of the BT icon. That is what made the BT
# icon look cut off.
#
# Parking it past the 128px width removes it and leaves the strip to the BT
# icon and battery. Keep SMART_BATTERY=y: with it off, screen_peripheral.c
# calls draw_animation() instead, which draws the same oversized crystal.
#
# Note the peripheral cannot be given central widgets: ZMK does not send layer
# or WPM state to a peripheral, so this screen can only ever show what it knows
# locally — its own battery and connection status.
# ---------------------------------------------------------------------------
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SMART_BATTERY=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CUSTOM_X=200

# ---------------------------------------------------------------------------
# The peripheral's vertical headroom is unfixed, and the obvious candidates are
# all dead ends. Recorded so nobody retries them:
#
# - Luna (24x32, the only art that fits besides the 100x32 vim logo) CANNOT be
#   used on a peripheral. CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_WPM
#   selects ZMK_WPM, which compiles zmk/app/src/wpm.c; that file references
#   as_zmk_keycode_state_changed, and ZMK puts events/keycode_state_changed.c
#   inside its central-only block in app/CMakeLists.txt while gating wpm.c only
#   on CONFIG_ZMK_WPM. ZMK_WPM has no `depends on !ZMK_SPLIT ||
#   ZMK_SPLIT_ROLE_CENTRAL`, so it is selectable where it cannot link:
#     undefined reference to `as_zmk_keycode_state_changed'
#
# - cat / gem / head / pokemon / spaceman are 69x68 and vip_marcos is 140x68,
#   none of which fit a 32px panel.
#
# - A larger battery figure is not reachable: battery.c hardcodes
#   pixel_operator_mono_16 in every branch, and the mono_22 font file that
#   ships with the module is not declared in fonts.h.
#
# That leaves the 100x32 vim logo, which needs the readouts squeezed into the
# remaining 28px and therefore a per-half .conf split, or leaving it as is.
# ---------------------------------------------------------------------------
