# Config for builds that include the `nice_oled` shield.
#
# ZMK applies <ZMK_CONFIG>/<shield>.conf for every shield in the SHIELD list,
# so this file affects only the nice!oled builds — the plain builds are
# untouched and remain a working rollback.

# Required by zmk-nice-oled: it replaces ZMK's built-in status screen.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# ---------------------------------------------------------------------------
# Widget positions, corrected for a 128x32 panel.
#
# zmk-nice-oled ships one set of coordinates for both `nice_oled` (128x32) and
# `nice_epaper` (nice!view, 160x68). Its vertical layout therefore assumes a
# ~160px long axis. The Aurora Lily58's OLED long axis is 128px, so anything
# with a default Y >= 128 renders off-screen:
#
#     LAYER    default Y = 146   -> never visible
#     PROFILE  default Y = 137   -> never visible
#
# How the geometry actually works, because it is not obvious:
#
# draw_canvas() lays widgets out in a 68-wide x 160-tall PORTRAIT design, then
# calls rotate_canvas() ("Rotate for horizontal display"), producing a 160x68
# image. The Aurora Lily58 panel is 128x32, so only a 32x128 window of that
# design is ever visible. Empirically that window is the HIGH-X band:
#
#   design X ~36..68  -> visible   (bongo cat sits at X=64, and it shows)
#   design X ~0..36   -> off-panel (battery/output/layer/mods all default to
#                                   X=0, which is why none of them appeared)
#
# So design X controls the physical VERTICAL position, and design Y controls
# the physical HORIZONTAL position. Widgets must have X >= ~36 to render at
# all; Y then spreads them across the 128px width.
# ---------------------------------------------------------------------------

# Put the layer name and battery inside the visible band, spread across the
# width: layer on the left, battery on the right.
CONFIG_NICE_OLED_WIDGET_LAYER_CUSTOM_X=50
CONFIG_NICE_OLED_WIDGET_LAYER_CUSTOM_Y=2
CONFIG_NICE_OLED_WIDGET_BATTERY_CUSTOM_X=50
CONFIG_NICE_OLED_WIDGET_BATTERY_CUSTOM_Y=95
CONFIG_NICE_OLED_WIDGET_PROFILE_CUSTOM_X=50
CONFIG_NICE_OLED_WIDGET_PROFILE_CUSTOM_Y=60

# Drop the WPM/bongo-cat animation. It occupies the visible band at X=64 and
# is decoration rather than information; removing it leaves the whole 32px
# strip for the layer/battery/profile readouts above.
CONFIG_NICE_OLED_WIDGET_WPM=n

# Not wanted: the Ctrl/Shift/Alt/Gui indicator box. Turning it off also frees
# its slot at Y=100. (This is the modifier box, not the caps/num/scroll-lock
# HID indicators, which stay on at the top of the screen.)
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=n

# ---------------------------------------------------------------------------
# Peripheral (left) half: no decorative animation.
#
# screen_peripheral.c only calls draw_animation() when SMART_BATTERY is off,
# so enabling this is the switch that removes the animation — and it spends
# the freed space on a real battery readout instead.
#
# Note this cannot be used to offload right-half widgets: ZMK does not send
# layer or WPM state to a peripheral, so the left screen can only ever show
# what it knows locally — its own battery and connection status.
# ---------------------------------------------------------------------------
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SMART_BATTERY=y
